name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tag history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Contexo.slnx -warnaserror
      - run: dotnet test Contexo.slnx --no-build
      - name: End-to-end tests (generated corpus, keyword mode - no model is downloaded in CI)
        run: dotnet test Contexo.slnx --no-build --filter "Category=EndToEnd" --logger "console;verbosity=normal"

  linux:
    name: Linux (build + test, headless UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Contexo.slnx -warnaserror
      - run: dotnet test Contexo.slnx --no-build

  macos:
    name: macOS (build only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Contexo.slnx -warnaserror
